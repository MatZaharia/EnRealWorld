[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "enrealworld"
version = "0.4.0"
description = "EnRealWorld: 4D World Creation as Agentic Engineering"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7,<3"]

[project.urls]
Homepage = "https://zihanguo1024.github.io/EnRealWorld/"
Repository = "https://github.com/ZihanGuo1024/EnRealWorld"

[project.optional-dependencies]
backend-validation = ["mujoco==3.3.2", "numpy>=2,<3", "scipy>=1.13,<2"]

constraints = ["z3-solver==4.16.0.0"]

interaction-tools = ["Pillow>=11,<14", "imageio>=2.37,<3", "imageio-ffmpeg>=0.6,<0.7"]

geometry = ["trimesh==4.12.2", "open3d==0.20.0", "coacd==1.0.14", "vhacdx==0.0.10", "scipy==1.18.1", "rtree==1.4.1", "manifold3d==3.5.4"]

all = [
    "mujoco==3.3.2", "numpy>=2,<3", "scipy==1.18.1", "z3-solver==4.16.0.0",
    "Pillow>=11,<14", "imageio>=2.37,<3", "imageio-ffmpeg>=0.6,<0.7",
    "trimesh==4.12.2", "open3d==0.20.0", "coacd==1.0.14", "vhacdx==0.0.10",
    "rtree==1.4.1", "manifold3d==3.5.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"enrealworld" = ["utils/evolve/refine_experience.md", "skills/**/*.md", "skills/**/*.json", "skills/**/*.yaml", "skills/**/*.py"]

[project.scripts]
enrealworld = "enrealworld.team.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests/fixtures"]
